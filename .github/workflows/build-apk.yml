name: Build APK

# Zero-cost CI/CD:
#  - runs on GitHub-hosted runners (free for public repositories),
#  - uploads the APK as a workflow artifact on every push,
#  - uploads the rendered UI frames, which the test suite compares against the
#    references committed under app/src/test/screenshots/,
#  - publishes a GitHub Release with the APK attached when a tag is pushed,
#  - re-records those references on demand (dispatch with record_references).
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK türü"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      record_references:
        description: "UI referans görüntülerini yeniden kaydet ve commit et (APK derlenmez)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Assemble APK
    # A reference-recording dispatch is a different job; building an APK in that
    # run would only waste 10 minutes and race it for the same Gradle lock.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.record_references) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.2 build-tools;37.0.0"

      - name: Restore Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::gradle-wrapper.jar is missing from the repository."
            exit 1
          fi
          chmod +x gradlew

      - name: Build debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        run: ./gradlew :app:assembleRelease --stacktrace

      # No continue-on-error: a red unit test must block the APK. The archive's
      # business rules (day bucketing, price snapshots, region grouping) are the
      # only automated check this project has, so letting it fail silently made
      # the whole suite decorative.
      #
      # `--no-build-cache` is load-bearing. When Gradle restores this task
      # FROM-CACHE it does not execute it, and Roborazzi's PNGs - which are not
      # declared outputs of `testDebugUnitTest` - are not restored with it. The
      # run then goes green having rendered nothing, and the artifact uploaded
      # below is silently empty.
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-build-cache --stacktrace

      # The unit-test run above also renders every screen through Robolectric and
      # Roborazzi. Those PNGs are the only way to look at the layout without an
      # emulator, so they travel with the run. `warn`, not `error`: a missing
      # folder is not a build failure, the test gate above already is one.
      - name: Upload UI screenshots
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: app/build/outputs/roborazzi
          retention-days: 30
          if-no-files-found: warn

      - name: Locate, verify and rename APK
        id: apk
        run: |
          set -euo pipefail

          # Pick the APK of the variant that was actually requested. Without
          # this the release run silently packaged the debug build (or vice
          # versa) because `find` returns whatever it sees first.
          if [ "${{ inputs.build_type }}" = "release" ]; then
            VARIANT="release"
          else
            VARIANT="debug"
          fi

          APK_PATH=$(find "app/build/outputs/apk/${VARIANT}" -name "*.apk" -type f | head -n 1)
          if [ -z "${APK_PATH}" ]; then
            echo "::error::No ${VARIANT} APK was produced."
            exit 1
          fi

          # Refuse to publish an APK that cannot be installed. An unsigned
          # release would look fine in the artifact list but fail on the phone.
          if ! "${ANDROID_HOME}/build-tools/37.0.0/apksigner" verify "${APK_PATH}"; then
            echo "::error::${APK_PATH} is not signed and cannot be installed."
            exit 1
          fi

          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          SHORT_SHA=${GITHUB_SHA::7}
          OUT_NAME="marti-takip-${VERSION:-1.0.0}-${VARIANT}-${SHORT_SHA}.apk"
          cp "${APK_PATH}" "${OUT_NAME}"
          echo "path=${OUT_NAME}" >> "$GITHUB_OUTPUT"
          echo "name=${OUT_NAME}" >> "$GITHUB_OUTPUT"
          echo "variant=${VARIANT}" >> "$GITHUB_OUTPUT"

          if [ "${VARIANT}" = "release" ] && [ -z "${{ secrets.RELEASE_KEYSTORE_PATH }}" ]; then
            echo "::warning::Release APK is debug-signed. Configure RELEASE_* secrets for a production build."
          fi
          ls -lh "${OUT_NAME}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: marti-takip-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: "Martı Takip ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            ## 📦 Martı Takip ${{ github.ref_name }}

            Saha operatörleri için batarya değişim takip uygulaması.

            ### Kurulum
            1. Aşağıdaki `.apk` dosyasını indir.
            2. Telefonda **Ayarlar → Güvenlik → Bilinmeyen kaynaklar** iznini ver.
            3. APK'ya dokunarak kur.

            ### Notlar
            - Konum izni verilirse her değişim noktası haritada görünür.
            - Konum izni verilmezse sayaçlar çalışmaya devam eder.
            - Veriler yalnızca cihazda (Room/SQLite) tutulur, hiçbir sunucuya gönderilmez.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Re-recording the UI references, on demand.
  #
  # The test suite compares every rendered frame with the reference committed
  # under `app/src/test/screenshots/`, so an intended visual change turns the
  # push build red until the references catch up. Doing that by hand means
  # downloading the `ui-screenshots` artifact and committing PNGs from a browser,
  # which is drudgery and easy to get half-right; this job does it in CI instead
  # and pushes the result itself.
  references:
    name: Record UI references
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.record_references }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.2 build-tools;37.0.0"

      - name: Restore Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::gradle-wrapper.jar is missing from the repository."
            exit 1
          fi
          chmod +x gradlew

      # Record mode, because the references are the stale half of this run: if
      # the recorded frames were still compared against them, the intended
      # difference would fail the suite before it could be recorded.
      #
      # `--no-build-cache` for the same reason as in the build job, only worse
      # here: a cache hit means the task never runs, so there is nothing to copy
      # into the reference folder. That is exactly how the first run of this job
      # failed, with a bare `ls: cannot access ...: No such file or directory`.
      - name: Render the frames in record mode
        env:
          MT_RECORD_SCREENSHOTS: "1"
        run: ./gradlew :app:testDebugUnitTest --no-build-cache --stacktrace

      - name: Copy the frames into the reference folder
        run: |
          set -euo pipefail

          # Search for the frames rather than assuming the one path they are
          # supposed to be in. A missing folder then reads as "the tests did not
          # run" with the frames that *were* found printed, instead of a bare
          # `ls: cannot access ...: No such file or directory`.
          mapfile -t FRAMES < <(find . -type d -name .git -prune -o -type f -name '*.png' -path '*roborazzi*' -print | sort)
          if [ "${#FRAMES[@]}" -eq 0 ]; then
            echo "::error::No rendered frames were found; the screenshot tests did not run."
            exit 1
          fi
          printf 'rendered: %s\n' "${FRAMES[@]}"

          mkdir -p app/src/test/screenshots
          cp "${FRAMES[@]}" app/src/test/screenshots/
          echo "--- references ---"
          ls -l app/src/test/screenshots

      # A run in which the screenshot tests silently did not execute looks exactly
      # like a run in which they all did, and both look like a green build. This
      # prints the evidence either way, so the next failure of the step above is
      # a fact and not a guess.
      - name: Report what the test run produced
        if: always()
        run: |
          echo "--- test result files ---"
          mapfile -t RESULTS < <(find . -path ./.git -prune -o -type f -path '*test-results*' -name '*.xml' -print | sort)
          printf 'count: %s\n' "${#RESULTS[@]}"
          if [ "${#RESULTS[@]}" -gt 0 ]; then
            grep -h -o '<testcase name="[^"]*"' "${RESULTS[@]}" | sort -u
          fi
          echo "--- every PNG in the workspace ---"
          find . -path ./.git -prune -o -type f -name '*.png' -print | sort

      - name: Upload the recorded frames
        uses: actions/upload-artifact@v7
        with:
          name: ui-references
          path: app/src/test/screenshots
          retention-days: 30
          if-no-files-found: error

      - name: Commit the references
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/screenshots
          if git diff --cached --quiet; then
            echo "References are unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore(test): UI referans görüntülerini yenile

          Co-Authored-By: Claude Code <noreply@anthropic.com>"
          git push
